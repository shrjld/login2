<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <main>


        <div class="continer1">
            <img src="photo/Screenshot (11).png" alt="login page">
        </div>

        <div class="continer2">
            <header>Sign up</header>

            <section class="name">
                <label for="fname">Full Name :</label><br>
                <input type="text" required minlength="3" placeholder="enter your name" id="fname"><br>
            </section>

            <section class="email">
                <label for="mail">Email :</label><br>
                <input type="email" required placeholder="enter your email" id="mail"><br>
            </section>

            <section class="username">
                <label for="uname">Username :</label><br>
                <input type="text" required placeholder="enter your username" id="uname"><br>
            </section>

            <section class="password">
                <label for="pass">Password :</label><br>
                <input type="password" required placeholder="enter your password" id="pass"><br>
            </section>

            <section class="repeatpass">
                <label for="rpass">Repeat Password :</label><br>
                <input type="password" required placeholder="repeat your password" id="rpass">
            </section>
            <section class="checkbox">
            <input type="checkbox" id="chb" checked>
            <label for="chb" >I agree to Terms of User</label>
        </section>
       
                <button class=" signup">Sign up</button>
                <button class="signin"  >Sign in  &#8594;</button>
               

        </div>
    </main>

</body>

</html>
